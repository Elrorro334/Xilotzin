<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Boletos & Pre-órdenes | Cine Tradicional Xilotzin</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#E11D2F">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        cneRed: '#E11D2F',
                        cneDark: '#0A0A0A',
                        cneCard: '#121212',
                        cneBorder: '#262626',
                        cneGold: '#DCA54C'
                    }, 
                    fontFamily: { 
                        sans: ['Montserrat', 'sans-serif'],
                        serif: ['"Playfair Display"', 'serif'],
                        mono: ['"Space Mono"', 'monospace']
                    } 
                } 
            } 
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="theme-traditional bg-cneDark text-cneLight antialiased max-w-[1600px] mx-auto min-h-screen shadow-2xl flex flex-col relative pb-24 md:pb-0">

    <header class="bg-cneCard border-b border-cneBorder sticky top-0 z-50 shadow-md">
        <div class="max-w-6xl mx-auto px-3 sm:px-4 h-16 sm:h-20 flex items-center justify-between">
            <div class="flex items-center gap-3 sm:gap-4">
                <a href="index.html" class="bg-cneDark text-white w-9 h-9 sm:w-11 sm:h-11 rounded-xl flex items-center justify-center border border-cneBorder hover:border-cneRed transition-colors shadow-md">
                    <i class="fa-solid fa-arrow-left text-sm sm:text-base"></i>
                </a>
                <div class="flex flex-col">
                    <h1 class="text-base sm:text-xl md:text-2xl font-serif font-black tracking-wider text-white uppercase leading-tight">Mis Tickets</h1>
                    <span class="text-[8px] sm:text-[9px] font-sans tracking-[0.3em] text-cneRed uppercase font-bold">Cine Teatro Xilotzin</span>
                </div>
            </div>
            
            <a href="preorden.html" class="bg-cneRed/20 border border-cneRed text-white text-[11px] sm:text-xs font-bold uppercase tracking-wider px-3 sm:px-4 py-2 rounded-xl hover:bg-cneRed transition-all flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Nueva Pre-orden</span><span class="sm:hidden">Pre-orden</span>
            </a>
        </div>
    </header>

    <main class="flex-grow w-full p-4 sm:p-6 md:p-12 relative">
        <div class="max-w-4xl mx-auto space-y-6" id="contenedor-boletos">
            <!-- Inyectado por js -->
        </div>
    </main>

    <!-- Modal para ver el QR en grande -->
    <div id="modal-qr-vista" class="fixed inset-0 z-[100] bg-cneDark/95 hidden flex items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-cneCard border-2 border-cneRed p-8 rounded-3xl max-w-sm w-full relative shadow-2xl text-center">
            <button onclick="cerrarModalQR()" class="absolute top-4 right-4 text-cneMuted hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <p class="text-cneRed font-bold text-xs uppercase tracking-[0.2em] mb-1 font-mono" id="modal-qr-folio">PRE-XIL-00000</p>
            <h3 id="modal-qr-titulo" class="text-xl font-serif font-black uppercase text-white mb-4">Película</h3>
            
            <div class="bg-white p-4 rounded-2xl w-60 h-60 mx-auto mb-4 shadow-inner">
                <img id="modal-qr-img" src="" class="w-full h-full object-contain" alt="QR Boleto">
            </div>
            
            <p class="text-[10px] text-cneMuted font-sans leading-relaxed">
                Muestra este código QR directamente al cajero en la taquilla del Cine Xilotzin para recoger tus entradas y combos.
            </p>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderTicketsUsuario();
        });

        function renderTicketsUsuario() {
            const contenedor = document.getElementById('contenedor-boletos');
            const preordenes = XilotzinDB.get('preordenes') || [];

            if (preordenes.length === 0) {
                contenedor.innerHTML = `
                    <div class="bg-cneCard border border-cneBorder rounded-3xl p-12 text-center">
                        <i class="fa-solid fa-ticket text-5xl text-cneRed/40 mb-4"></i>
                        <h3 class="text-xl font-serif font-black text-white uppercase mb-2">No tienes boletos apartados</h3>
                        <p class="text-xs text-cneMuted font-sans mb-6">Consulta nuestra cartelera inteligente y genera tu código QR en minutos.</p>
                        <a href="index.html" class="bg-cneRed text-white font-bold text-xs uppercase px-6 py-3 rounded-xl hover:bg-red-700 transition-colors shadow-lg inline-flex items-center gap-2">
                            <i class="fa-solid fa-clapperboard"></i> Ir a la Cartelera
                        </a>
                    </div>
                `;
                return;
            }

            contenedor.innerHTML = preordenes.map((p, i) => `
                <div class="bg-cneCard border border-cneBorder rounded-3xl p-6 shadow-xl flex flex-col md:flex-row items-center justify-between gap-6 hover:border-cneRed/50 transition-all">
                    <div class="flex items-center gap-4 w-full md:w-auto">
                        <div class="w-16 h-16 rounded-2xl bg-white p-1.5 shrink-0 shadow">
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=CINE_XILOTZIN_PREORDEN:${p.codigo}" class="w-full h-full object-contain">
                        </div>
                        <div class="flex flex-col">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="font-mono text-xs font-bold text-cneRed">${p.codigo}</span>
                                <span class="text-[9px] font-black uppercase px-2 py-0.5 rounded ${p.estado === 'CANJEADO' ? 'bg-gray-800 text-gray-400' : 'bg-green-950 text-green-400 border border-green-800'}">${p.estado}</span>
                            </div>
                            <h3 class="text-lg font-serif font-black uppercase text-white leading-tight">${p.pelicula}</h3>
                            <p class="text-xs text-cneMuted font-sans mt-1">
                                Horario: <strong>${p.horario}</strong> • ${p.boletosGeneral} Accesos Generales
                            </p>
                            <span class="text-[10px] text-cneGold mt-1 font-semibold">
                                Válido hasta: ${p.fechaVencimientoFormateada || p.fechaVencimiento} (8-15 días de vigencia)
                            </span>
                        </div>
                    </div>

                    <div class="flex items-center justify-between md:justify-end gap-5 w-full md:w-auto border-t md:border-t-0 border-cneBorder pt-4 md:pt-0">
                        <div class="text-left md:text-right">
                            <span class="text-[10px] text-cneMuted uppercase font-bold tracking-wider block">Importe en Caja</span>
                            <span class="text-2xl font-serif font-black text-white">$${p.total} MXN</span>
                        </div>
                        <button onclick="verQRGrande('${p.codigo}', '${p.pelicula}')" class="bg-cneDark hover:bg-cneRed text-white text-xs font-bold uppercase tracking-wider px-5 py-3 rounded-xl border border-cneBorder hover:border-cneRed transition-all flex items-center gap-2 shadow">
                            <i class="fa-solid fa-qrcode"></i> Ver QR
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function verQRGrande(codigo, titulo) {
            document.getElementById('modal-qr-folio').innerText = codigo;
            document.getElementById('modal-qr-titulo').innerText = titulo;
            document.getElementById('modal-qr-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=CINE_XILOTZIN_PREORDEN:${codigo}`;
            document.getElementById('modal-qr-vista').classList.remove('hidden');
        }

        function cerrarModalQR() {
            document.getElementById('modal-qr-vista').classList.add('hidden');
        }
    </script>

    <!-- Navegación Móvil Inferior -->
    <nav class="md:hidden fixed bottom-0 left-0 w-full bg-cneDark/95 backdrop-blur-lg border-t border-cneBorder flex justify-around z-50 h-16 shadow-[0_-10px_30px_rgba(0,0,0,0.5)] px-2 mobile-bottom-nav">
        <a href="index.html" class="flex-1 flex flex-col items-center justify-center gap-1 text-cneMuted hover:text-white transition-colors">
            <i class="fa-solid fa-clapperboard text-lg"></i>
            <span class="text-[9px] font-sans font-bold uppercase tracking-widest mt-0.5">Cartelera</span>
        </a>
        <a href="dulceria.html" class="flex-1 flex flex-col items-center justify-center gap-1 text-cneMuted hover:text-white transition-colors">
            <i class="fa-solid fa-store text-lg"></i>
            <span class="text-[9px] font-sans font-bold uppercase tracking-widest mt-0.5">Dulcería</span>
        </a>
        <a href="preorden.html" class="flex-1 flex flex-col items-center justify-center gap-1 text-cneMuted hover:text-white transition-colors">
            <i class="fa-solid fa-qrcode text-lg"></i>
            <span class="text-[9px] font-sans font-bold uppercase tracking-widest mt-0.5">Pre-orden</span>
        </a>
        <a href="perfil.html" class="flex-1 flex flex-col items-center justify-center gap-1 text-cneGold">
            <i class="fa-solid fa-ticket text-lg"></i>
            <span class="text-[9px] font-sans font-bold uppercase tracking-widest mt-0.5">Mis Boletos</span>
        </a>
    </nav>
</body>
</html>
